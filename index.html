<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مراسلة واتساب</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="./Mon.png">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            background:
                radial-gradient(circle at 20% 20%, rgba(37, 211, 102, .18), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(14, 165, 233, .16), transparent 30%),
                linear-gradient(135deg, #07111f, #0b1728 50%, #07111f);

            color: #fff;
            overflow: hidden;
        }

        /* زخرفة الخلفية */
        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .18;
            pointer-events: none;
        }

        body::before {
            background: #25d366;
            top: -100px;
            right: -80px;
        }

        body::after {
            background: #0ea5e9;
            bottom: -100px;
            left: -80px;
        }

        .card {
            position: relative;
            width: 100%;
            max-width: 430px;
            padding: 34px 26px 26px;

            background: rgba(15, 23, 42, .78);
            border: 1px solid rgba(255, 255, 255, .10);
            border-radius: 28px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, .45),
                inset 0 1px 0 rgba(255, 255, 255, .06);

            text-align: center;
        }

        .logo {
            width: 76px;
            height: 76px;
            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 24px;

            background: linear-gradient(145deg, #25d366, #128c7e);

            box-shadow:
                0 12px 30px rgba(37, 211, 102, .28),
                inset 0 1px 1px rgba(255,255,255,.25);

            font-size: 38px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 27px;
            font-weight: 800;
            letter-spacing: -.5px;
        }

        .description {
            margin: 0 auto 28px;
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.7;
        }

        .field {
            text-align: right;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            height: 58px;

            padding: 0 18px;

            border-radius: 17px;
            border: 1px solid rgba(148, 163, 184, .20);

            background: rgba(2, 6, 23, .70);
            color: #fff;

            font-size: 21px;
            font-weight: 600;
            letter-spacing: 1px;

            text-align: center;
            outline: none;

            transition: .25s ease;
        }

        input::placeholder {
            color: #475569;
            font-size: 17px;
            letter-spacing: 1px;
        }

        input:focus {
            border-color: #25d366;

            box-shadow:
                0 0 0 4px rgba(37, 211, 102, .12),
                0 8px 25px rgba(0,0,0,.18);
        }

        .clear-btn {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);

            width: 30px;
            height: 30px;

            padding: 0;
            margin: 0;

            border: none;
            border-radius: 50%;

            background: rgba(148, 163, 184, .12);
            color: #94a3b8;

            cursor: pointer;
            font-size: 18px;

            display: none;
            align-items: center;
            justify-content: center;
        }

        .clear-btn:hover {
            background: rgba(239, 68, 68, .18);
            color: #f87171;
        }

        .hint {
            margin-top: 8px;
            color: #64748b;
            font-size: 12px;
            text-align: center;
        }

        #openBtn {
            width: 100%;
            height: 58px;

            border: none;
            border-radius: 17px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            background: linear-gradient(135deg, #25d366, #16a34a);
            color: white;

            font-size: 16px;
            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 10px 25px rgba(37, 211, 102, .22);

            transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
        }

        #openBtn:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);

            box-shadow:
                0 14px 32px rgba(37, 211, 102, .30);
        }

        #openBtn:active {
            transform: translateY(0);
        }

        #openBtn svg {
            width: 23px;
            height: 23px;
            fill: currentColor;
        }

        .footer {
            margin-top: 22px;
            padding-top: 18px;

            border-top: 1px solid rgba(148, 163, 184, .10);

            color: #64748b;
            font-size: 12px;
        }

        .footer span {
            color: #94a3b8;
        }

        .toast {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);

            width: calc(100% - 40px);
            max-width: 380px;

            padding: 13px 17px;

            background: rgba(15, 23, 42, .94);
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 14px;

            color: #e2e8f0;
            text-align: center;
            font-size: 14px;

            box-shadow: 0 15px 40px rgba(0,0,0,.4);

            opacity: 0;
            transition: .3s ease;
            z-index: 9999;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .card {
                padding: 30px 20px 22px;
                border-radius: 24px;
            }

            .logo {
                width: 68px;
                height: 68px;
                font-size: 33px;
            }

            h1 {
                font-size: 24px;
            }

            input {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="logo">
            💬
        </div>

        <h1>مراسلة واتساب</h1>

        <p class="description">
            أدخل رقم الهاتف العراقي لفتح محادثة مباشرة على واتساب
        </p>

        <div class="field">

            <label for="phone">رقم الهاتف</label>

            <div class="input-wrapper">

                <input
                    id="phone"
                    type="tel"
                    inputmode="numeric"
                    autocomplete="tel"
                    maxlength="13"
                    placeholder="0770 888 8080"
                    aria-label="رقم الهاتف"
                >

                <button
                    type="button"
                    class="clear-btn"
                    id="clearBtn"
                    aria-label="مسح الرقم"
                >
                    ×
                </button>

            </div>

            <div class="hint">
            </div>

        </div>

        <button id="openBtn" type="button">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20.52 3.48A11.82 11.82 0 0 0 12.08 0C5.55 0 .23 5.32.23 11.85c0 2.09.55 4.13 1.59 5.94L.13 24l6.35-1.66a11.84 11.84 0 0 0 5.6 1.42h.01c6.53 0 11.85-5.32 11.85-11.85 0-3.17-1.24-6.14-3.42-8.43ZM12.09 21.8h-.01a9.91 9.91 0 0 1-5.05-1.38l-.36-.21-3.77.99 1.01-3.67-.23-.38a9.89 9.89 0 0 1-1.51-5.3C2.17 6.39 6.62 1.94 12.09 1.94c2.65 0 5.14 1.03 7.01 2.91a9.86 9.86 0 0 1 2.9 7.02c0 5.47-4.45 9.93-9.91 9.93Zm5.44-7.43c-.3-.15-1.77-.87-2.05-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.47-.89-.79-1.49-1.76-1.66-2.06-.17-.3-.02-.46.13-.61.14-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.49s1.07 2.89 1.22 3.09c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.08 1.77-.72 2.02-1.42.25-.7.25-1.29.17-1.42-.07-.12-.27-.2-.57-.35Z"/>
            </svg>

            مراسلة على واتساب

        </button>

        <div class="footer">
            إعداد <span>حسام الحديدي</span>
        </div>

    </main>

    <div id="toast" class="toast"></div>

    <script>

        const phoneInput = document.getElementById("phone");
        const openBtn = document.getElementById("openBtn");
        const clearBtn = document.getElementById("clearBtn");
        const toast = document.getElementById("toast");

        const DIAL_CODE = "964";

        // تحويل الأرقام العربية إلى إنجليزية
        function normalizeDigits(value) {

            return (value || "")
                .replace(/[\u0660-\u0669]/g, digit =>
                    "٠١٢٣٤٥٦٧٨٩".indexOf(digit)
                )
                .replace(/[\u06F0-\u06F9]/g, digit =>
                    "۰۱۲۳۴۵۶۷۸۹".indexOf(digit)
                )
                .replace(/\D/g, "");
        }

        // تنسيق الرقم:
        // 07708888080
        // ↓
        // 0770 888 8080
        function formatIraqiNumber(value) {

            let digits = normalizeDigits(value);

            // الحد الأقصى 11 رقمًا
            digits = digits.substring(0, 11);

            if (digits.length <= 4) {
                return digits;
            }

            if (digits.length <= 7) {
                return digits.substring(0, 4) + " " +
                       digits.substring(4);
            }

            return digits.substring(0, 4) + " " +
                   digits.substring(4, 7) + " " +
                   digits.substring(7);
        }

        function getRawNumber() {
            return normalizeDigits(phoneInput.value);
        }

        function buildWaLink() {

            let number = getRawNumber();

            // إذا كتب المستخدم الرقم بصيغة 0770...
            if (number.startsWith("0")) {
                number = number.substring(1);
            }

            // التحقق من الرقم العراقي
            if (
                number.length !== 10 ||
                !number.startsWith("7")
            ) {
                return null;
            }

            return `https://wa.me/${DIAL_CODE}${number}`;
        }

        function showToast(message) {

            toast.textContent = message;
            toast.classList.add("show");

            clearTimeout(window.toastTimer);

            window.toastTimer = setTimeout(() => {
                toast.classList.remove("show");
            }, 2500);
        }

        function updateClearButton() {

            clearBtn.style.display =
                getRawNumber().length > 0
                    ? "flex"
                    : "none";
        }

        // عند الكتابة
        phoneInput.addEventListener("input", () => {

            const cursorPosition = phoneInput.selectionStart;

            const oldValue = phoneInput.value;
            const raw = normalizeDigits(oldValue);

            const formatted = formatIraqiNumber(raw);

            phoneInput.value = formatted;

            updateClearButton();

            // وضع المؤشر في نهاية الرقم
            phoneInput.setSelectionRange(
                phoneInput.value.length,
                phoneInput.value.length
            );
        });

        // فتح واتساب
        openBtn.addEventListener("click", () => {

            const link = buildWaLink();

            if (!link) {

                showToast("يرجى إدخال رقم عراقي صحيح، مثال: 0770 888 8080");

                phoneInput.focus();

                return;
            }

            window.location.href = link;
        });

        // زر المسح
        clearBtn.addEventListener("click", () => {

            phoneInput.value = "";

            updateClearButton();

            phoneInput.focus();
        });

        // الضغط على Enter
        phoneInput.addEventListener("keydown", event => {

            if (event.key === "Enter") {

                event.preventDefault();

                openBtn.click();
            }
        });

        // Service Worker للتشغيل كـ PWA
        if ("serviceWorker" in navigator) {

            navigator.serviceWorker.register(
                'data:text/javascript,self.addEventListener("install",e=>{e.waitUntil(Promise.resolve())})'
            ).catch(() => {});
        }

    </script>

</body>
</html>
